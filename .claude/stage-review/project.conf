# Projectinstellingen voor de stage-review-skill (.claude/skills/stage-review).
# Wordt gesourced door scripts/review-worktree.sh en gelezen door Claude, comments inbegrepen.
# Alles wat projectspecifiek is staat hier en in criteria.md; de skill-map zelf is generiek.

# Uit de cold copy verwijderd, gescheiden door spaties, relatief aan de repo-root. Dit is met
# opzet een deterministische lijst: een lijst die Claude "ongeveer" toepast is een lek.
# `.claude` haalt deze skill en haar config buiten bereik van de reviewer. AGENTS.md blijft
# staan: daarin staan de eigen waarschuwingen van het framework, die de reviewer nodig heeft.
STRIP=".claude CLAUDE.md README.md docs spikes"

# De reviewer ziet de hele stage-diff (BASE tot TIP) behalve de STRIP-items, die automatisch
# worden uitgesloten (een gewijzigd record onder docs/ in de diff zou de besluiten tonen), en
# deze paden: ruis die niet de moeite van het reviewen waard is. Een weglating hier is stil,
# dus houd de lijst kort.
EXCLUDE_PATHS="package-lock.json"

# De branch waarin een stage gemerged wordt. De standaard-base van een review is de merge-base
# van de gereviewde ref en deze branch.
BASE_REF="main"

# Waar de reviewmappen komen (één `.review-<name>`-map per review), relatief aan de repo-root.
# Met opzet buiten de repo: het materiaal en de resultaten van de reviewer zijn geen code.
RESULTS_ROOT="../resources/reviews"

# yes: de cold worktree krijgt een junction naar de node_modules van de repo, zodat lint en tsc
# werken. `next build` werkt niet via de junction (Turbopack); rapporteer nooit een build
# vanaf daar.
LINK_NODE_MODULES="yes"

# Checks die de reviewer in de cold worktree mag draaien, en die Claude na de fixes draait.
# `npm run build` wordt door de executors in de echte repo gedraaid, niet door de reviewer.
VERIFY="npm run lint && npm run typegen && npm run typecheck"

# Poort die executors voor een dev server mogen gebruiken. Nooit de standaardpoort 3000: die is
# van de eigenaar.
EXECUTOR_DEV_PORT="3101"

# Taal van de reviewresultaten en van alles wat de reviewer schrijft.
REPORT_LANGUAGE="Dutch, addressing the reader as \"je\""

# --- Gebruikt door Claude in de filterstap en bij het uitschrijven van fixes (niet gelezen door het script) ---
# Besluitrecord: de grootboekrecords onder docs/grootboek/ (adr, pdr, hdr, journaal), te vinden
# via docs/index.yml en de registers in docs/grootboek/registers/.
# Een bevinding die een record herhaalt of tegenspreekt wordt getoond als "al besloten".
#
# Recordregel (CLAUDE.md): een wijziging die een record tegenspreekt werkt dat record bij of
# vervangt het, in dezelfde commit als de code.
#
# De eigenaar is Nederlands en wil "je". Walk-through-tekst aan de eigenaar is Nederlands;
# prompts voor subagents zijn Engels.
