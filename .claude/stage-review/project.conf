# Project settings for the stage-review skill (.claude/skills/stage-review).
# Sourced by scripts/review-worktree.sh and read by Claude, comments included.
# Everything project-specific lives here and in criteria.md; the skill folder itself is generic.

# Removed from the cold copy, space separated, relative to the repo root. This is a
# deterministic list on purpose: a list Claude applies "roughly" is a leak.
# `.claude` takes this skill and its config out of reach of the reviewer. AGENTS.md stays:
# it holds the framework's own warnings, which the reviewer needs.
STRIP=".claude CLAUDE.md README.md docs spikes"

# The reviewer sees the whole stage diff (BASE to TIP) except the STRIP items, which are
# excluded automatically (a changed docs/plan.md in the diff would show the plan), and these
# paths: noise that is not worth reviewing. An omission here is silent, so keep it short.
EXCLUDE_PATHS="package-lock.json"

# The branch a stage is merged into. The default base of a review is the merge-base of the
# reviewed ref and this branch.
BASE_REF="main"

# Where the review folders go (one `.review-<name>` folder per review), relative to the repo
# root. Outside the repo on purpose: the reviewer's materials and results are not code.
RESULTS_ROOT="../resources/reviews"

# yes: the cold worktree gets a junction to the repo's node_modules, so lint and tsc work.
# `next build` does not work through the junction (Turbopack); never report a build from it.
LINK_NODE_MODULES="yes"

# Checks the reviewer may run in the cold worktree, and that Claude runs after the fixes.
# `npm run build` is run by the executors in the real repo, not by the reviewer.
VERIFY="npm run lint && npx next typegen && npx tsc --noEmit"

# Port executors may use for a dev server. Never the default 3000: that is the owner's.
EXECUTOR_DEV_PORT="3101"

# Language of the review results and of everything the reviewer writes.
REPORT_LANGUAGE="Dutch, addressing the reader as \"je\""

# --- Used by Claude in the filter step and when fixes are written up (not read by the script) ---
# Decision record: docs/plan.md, sections "Decisions", "Open questions" and "Decision log".
# A finding that repeats or contradicts an entry there is shown as "already decided".
#
# Plan rule (CLAUDE.md): a change that contradicts the plan updates docs/plan.md in the
# same commit as the code and adds a Decision log row: Date | Source | Change | Why.
# Source says who ORIGINATED the decision: `agent`, `you` (the owner decided it, also when
# picking from options), or `ported`. Approving or rejecting a proposal does not change its
# origin; a finding the reviewer proposed and the owner accepted is `agent`.
#
# The owner is Dutch and wants "je". Walk-through text to the owner is in Dutch; prompts for
# subagents are in English.
