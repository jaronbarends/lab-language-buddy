# DFT Register — overzicht van alle driftrapporten
# Een driftrapport is een reconciliatie: komt de documentatie nog overeen met de werkelijkheid
# (code, schema, omgeving)?
#
# Lifecycle: open → in_progress → resolved
#
# Een DFT die een leidend document tegen de code legt, noemt (HDR-022):
#   documenten     — de leidende documenten die hij controleerde (paden)
#   getoetst-tegen — de commit waarvan de code is vergeleken
# `npm run docs:drift` meet de drift van een document vanaf de nieuwste getoetst-tegen-commit van
# een afgesloten DFT die het noemt. Een DFT over iets anders dan een leidend document laat de
# twee velden weg.

