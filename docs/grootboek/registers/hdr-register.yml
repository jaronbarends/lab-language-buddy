    notitie: "Overgezet uit plan.md (HDR-015): het besluit van 09-23 (geen tests) is op 10-27 versmald met de uitzondering voor scripts; de huidige stand staat in Besluit, de eerste stand in Voorgeschiedenis"
    bestand: hdr-017-geen-testsuite-behalve-scripts.md
  - id: "HDR-018"
    titel: "Contextlagen en een drift-check voor de documentatie"
