    notitie: "REQ-GG-06. Drempel drie (het requirement), niet meer dan drie (de HDR-gids van de skill). Gevuld uit zes geheugennotities. Het loggen hangt van de agent af: geen hook ziet een correctie van de mens. Nummering: arc/bubble-animation heeft een eigen HDR-008 en hernummert via docs:renumber (HDR-007)"
