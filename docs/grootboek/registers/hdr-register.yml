  - id: "HDR-022"
    titel: "Het driftsignaal meet vanaf de laatste reconciliatie, niet vanaf de laatste aanraking"
    status: implemented
    versie: "1.0"
    implementatie: 100
    omgeving: geen
    datum: 2026-11-07
    implementatie-datum: 2026-11-07
    beslissing: "Het nulpunt van een leidend document is de nieuwste getoetst-tegen-commit van een afgesloten DFT die het onder documenten noemt; een aanraking van het document reset niets; nooit gereconcilieerd betekent gemeten vanaf de commit die het document toevoegde; de CLAUDE.md-bestanden onder src/ vallen onder het signaal met hun eigen map als werkgebied; leidende documenten vallen buiten elk werkgebied; een pad onder documenten moet exact een leidend document zijn, en een afgesloten DFT met documenten zonder getoetst-tegen is een fout"
    notitie: "Vervangt de baseline van HDR-008, de rest daarvan blijft. Aanleiding: na de merge van de bubbelanimatie (PR #33, 2026-10-30) waarschuwde docs:check een week, niemand reconcilieerde, en drie commits die de balans alleen vertaalden en verwijzingen bijwerkten (2026-11-06) maakten het signaal stil. Jarón koos het register boven een veld in het document. Eerste reconciliatie onder deze regel: DFT-004. Het signaal is luider; een ritme voor reconciliaties ligt nog niet vast"
    bestand: hdr-022-drift-gemeten-vanaf-de-reconciliatie.md
