    beslissing: "Een leidend document declareert zijn werkgebied in de front matter; npm run docs:drift somt de codewijzigingen in dat gebied op sinds het document het laatst is aangeraakt, docs:check waarschuwt bij drift en faalt bij een ontbrekend pad; een signaal wordt gevolgd door een reconciliatie en een DFT"
    notitie: "REQ-GG-05. Signaal, geen oordeel. Bewezen op een wegwerp-checkout van arc/bubble-animation (750dc49, vier bestanden); de reconciliatie die op een echt signaal volgt is DFT-004 (2026-11-07), niet bij de merge van arc/bubble-animation zoals verwacht. Nummering: arc/bubble-animation heeft een eigen HDR-008 en hernummert via docs:renumber (HDR-007). De baseline (de laatste commit die het document aanraakte) is op 2026-11-07 vervangen door HDR-022 (de laatste afgesloten reconciliatie). HDR-022 breidt ook uit: de CLAUDE.md-bestanden onder src/ zijn leidende documenten met hun eigen map als werkgebied en zonder front matter, en leidende documenten vallen buiten elk werkgebied. De rest geldt nog"
