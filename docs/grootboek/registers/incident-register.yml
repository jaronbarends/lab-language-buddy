# Incidentregister — terugkerende fouten, geteld per patroon
# Eén keer is een incident, twee keer is toeval, drie keer is een zwakte van het harnas
# (REQ-GG-06). Bij drie wordt het patroon vastgelegd (een regel, hook of skill) en als
# HDR geboekt, waarvan het id in `maatregel` komt. `npm run docs:check` waarschuwt tot dat is gebeurd.
# Een incident na de maatregel vraagt een oordeel: hield de maatregel, of is er iets stevigers
# nodig? `docs:check` waarschuwt zolang de telling boven `beoordeeld-tot` staat (HDR-037).
#
# Een incident is een regel, geen beslissing: geen ids, geen documenten (HDR-001 boekt beslissingen).
# Een incident is een fout in hoe de agent werkt, wie of wat hem ook vond: een correctie van Jarón,
# een review, een check, een koude-startbeoordeling of de agent zelf. Een toolfout telt als hij
# eerder zo is voorgekomen. Voeg een regel toe en zeg dat in één zin. Alleen toevoegen, zoals de
# andere registers; `maatregel` invullen en `beoordeeld-tot` ophogen gebeurt met Jaróns akkoord.
#
# Velden:
#   patroon        — een slug; een nieuwe fout die op een bestaand patroon lijkt sluit daarbij aan
#   maatregel      — de HDR die het patroon heeft vastgelegd (leeg tot dan)
#   beoordeeld-tot — de telling tot waar de incidenten tegen de maatregel zijn beoordeeld; staat
#                    alleen naast `maatregel`, en is daar verplicht. Hoog het op na een oordeel:
#                    "de maatregel hield" in de `wat` van het incident, of een stevigere maatregel
#   datum          — YYYY-MM-DD
#   aantal         — optioneel, standaard 1: meerdere keren dezelfde fout in één keer
#   wat, bron      — wat er gebeurde, en waar het is gevonden

patronen:
  - patroon: naming-precision
    titel: "Een naam belooft meer of minder dan de code doet"
    maatregel: HDR-010
    beoordeeld-tot: 7
    incidenten:
