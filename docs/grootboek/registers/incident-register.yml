        wat: "Het verwijderen van dode code werd ook gecommit, en een haalbaarheidsvraag over een branch werd beantwoord door git ter plekke te herstructureren"
        bron: "geheugennotitie feedback-dont-execute-on-questions"
  - patroon: review-point-context
    titel: "Een beslispunt wordt voorgelegd voordat het in de chat op zichzelf staat"
    maatregel: HDR-034
    beoordeeld-tot: 3
    incidenten:
      - datum: 2026-10-03
        wat: "Een bevinding beschreven als een schema met drie losse optionele velden, zodat het reviewbestand geopend moest worden om haar te begrijpen"
        bron: "geheugennotitie feedback-review-points-self-contained"
      - datum: 2026-11-13
        wat: "Bij K9 van JNL-002 opties en een advies gegeven zonder eerst uit te leggen waar de kwestie over ging; Jarón noemde het irritant en zei dat het vaak gebeurt. De geheugennotitie werd verbreed naar elk beslispunt, maar de indexregel in MEMORY.md bleef over reviewbevindingen gaan en het register kreeg geen regel. Ook die sessie begon met een startprompt die een lead-sessie in Jaróns stem had geschreven"
        bron: "correctie van Jarón in de sessie voor K9 van de grootboekronde"
      - datum: 2026-11-13
        wat: "Een kwartier later bij K10 van JNL-002 hetzelfde: eerst een vetgedrukt advies, dan een leesverslag en een optietabel, nergens wat de kwestie is. De sessie begon met een startprompt die een lead-sessie in Jaróns stem had geschreven: K10 in drie compacte zinnen en de vraag om opties met één advies, niet om uitleg, zodat het leek alsof Jarón de kwestie al kende. De indexregel van de geheugennotitie noemde alleen reviewbevindingen"
        bron: "correctie van Jarón in de sessie voor K10 van de grootboekronde"
