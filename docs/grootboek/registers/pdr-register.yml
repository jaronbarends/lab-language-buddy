# PDR Register — overview of all Product Decision Records
# Product decisions document the WHY behind feature choices, prioritisation and
# product direction.
#
# Same fields and lifecycle as the ADR register; a PDR also carries a changelog as soon
# as the course shifts within the same core decision.

pdrs:
  - id: "PDR-001"
    titel: "Een app voor dagelijks gebruik, en een experiment in werkwijze"
    status: implemented
    versie: "1.0"
    implementatie: 100
    omgeving: geen
    datum: 2026-11-01
    implementatie-datum: 2026-11-01
    beslissing: "Het project is een app die Jaron dagelijks gebruikt en een experiment in werkwijze (AI schrijft het grootste deel van de code); de bestaande Language Buddy-app is geen bron meer (de agent gebruikt de repo niet, tenzij Jaron een specifiek bestand aanwijst); er is geen vergelijking of synchronisatie meer"
    notitie: "README (Why this repo exists) is op 2026-11-01 door Jaron aangepast; CLAUDE.md liep al gelijk. De regel Keeping the experiment honest uit plan.md staat in kortere vorm als HDR-016"
