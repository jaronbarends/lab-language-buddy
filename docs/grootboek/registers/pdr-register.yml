# PDR Register — overzicht van alle Product Decision Records
# Productbeslissingen leggen het WAAROM vast achter featurekeuzes, prioritering en
# productrichting.
#
# Dezelfde velden en levenscyclus als het ADR-register; een PDR heeft ook een changelog zodra
# de koers verschuift binnen dezelfde kernbeslissing.

pdrs:
  - id: "PDR-001"
