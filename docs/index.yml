# Register of the documentation. Read this first, then open only the document you need.
# `npm run docs:check` verifies that every path below exists and that no document under
# docs/ is missing from the list. Keep it current in the same commit as the change.

documents:
  - path: README.md
    what: Front door. What the app is, who it is for, stack, how to run it, build stages.
    read_when: first contact with the repo; changing env vars or the stack table.
  - path: CLAUDE.md
    what: Working agreements (language, commits, branches, checks) and the map of the context layers.
    read_when: always loaded.
  - path: AGENTS.md
    what: Warning that this Next.js version differs from training data; read node_modules/next/dist/docs first.
    read_when: always loaded; before writing any Next.js code.
  - path: docs/plan.md
    what: Living plan and decision record. See `plan_sections` for where to look.
    read_when: before a structural change; when a choice in the code looks arbitrary.
  - path: docs/adr/0001-decisions-live-in-the-plan.md
    what: Why decisions are kept in plan.md instead of one file each.
    read_when: deciding where to record a decision.
  - path: docs/code-architectuur.md
    what: Code-organization doctrine (REQ-AH-10, agentic harnas onderdeel D) — qualitative rules only, no thresholds or register.
    read_when: splitting or growing a file; before adding a new structural pattern.
  - path: docs/code-architectuur-register.json
    what: Machine-readable contract (REQ-AH-11) — warn/hard-limit thresholds and the per-file ceiling/excluded decisions. Line counts are a snapshot; REQ-AH-12 makes them live-measured.
    read_when: a file crosses the warn threshold; recording or revisiting a ceiling decision.
  - path: docs/grootboek/CLAUDE.md
    what: Rules for the grootboek folder (experiment on arc/* branches): document types, conventions, duty to communicate.
    read_when: loads by itself when working in docs/grootboek.
  - path: docs/grootboek/hdr/hdr-001-grootboek-stelsel.md
    what: Why the grootboek exists next to plan.md, and which decisions it holds (from 2026-10-20 on).
    read_when: deciding whether a decision goes in the grootboek or in plan.md.
  - path: docs/grootboek/hdr/hdr-002-balance-next-to-plan-drift-trial.md
    what: Why the technical balance is kept, as a trial of the grootboek's drift detection; plan.md stays the source until the trial is settled.
    read_when: deciding whether to keep, change or drop the balance; before the drift trial.
  - path: docs/grootboek/hdr/hdr-003-ci-checks-wanted-on-pull-requests.md
    what: Decision that lint/typecheck/build/docs:check should run on PRs to main; not yet built (K8).
    read_when: setting up CI for this repo.
  - path: docs/grootboek/hdr/hdr-004-session-scoped-refactor-loop.md
    what: Why REQ-AH-13's refactor loop is a session-scoped PreToolUse hook, not ARC's unattended git-level push-hook (refused by the safety classifier).
    read_when: touching the refactor loop; porting another ARC harness convention.
  - path: docs/grootboek/hdr/hdr-005-renumber-on-merge-when-numbers-collide.md
    what: Rule for parallel arc/* branches that book the same record number; the branch that merges second renumbers its own records, in its own branch.
    read_when: merging an arc/* branch that has booked grootboek records; numbering a new record.
  - path: docs/grootboek/hdr/hdr-006-communication-duty-hook.md
    what: Why a PostToolUse hook reminds the agent of the duty to communicate when a leading document changes; where the list lives, the blind spots, subagent wording.
    read_when: changing the list of leading documents; touching notify-leading-document or leading-documents.json.
  - path: docs/grootboek/hdr/hdr-007-mechanical-renumbering.md
    what: Why record renumbering is a script, a duplicate-id check and a merge guard hook, and why the order is renumber first, merge second (reverses HDR-005's steps).
    read_when: merging arc/arc-main or main into a branch; touching renumber-records, the guard-merge-renumber hook or the duplicate-id check.
  - path: docs/grootboek/hdr/hdr-008-drift-signal.md
    what: Why leading documents declare a werkgebied and a script signals when the code in it changed after the document; signal not verdict, followed by a reconciliation and a DFT (REQ-GG-05).
    read_when: touching drift-signal or the werkgebied field; running a reconciliation; creating a new balance.
  - path: docs/grootboek/hdr/hdr-009-incident-register.md
    what: Why recurring faults are logged by pattern in an incident register and codified at three (REQ-GG-06); the threshold, what happens at three, and why logging depends on the agent.
    read_when: logging an incident; touching the incident register or its counter; a docs:check warning about a pattern.
  - path: docs/grootboek/hdr/hdr-010-names-checked-against-what-they-promise.md
    what: The naming rule in code-style.md and why: seven naming corrections in the stage 4 review, the first pattern codified through the incident register.
    read_when: naming a function, status or type in src/; a naming correction from Jaron.
  - path: docs/grootboek/hdr/hdr-011-arc-base-branch-and-branch-first.md
    what: Why the root CLAUDE.md names arc/arc-main as the base for arc work and says the branch comes before the first edit; found in the first cold-start run.
    read_when: starting work on an arc branch; updating the Branches line when arc/arc-main merges into main.
  - path: docs/grootboek/journaal/jnl-002-cold-start-onboarding.md
    what: Cold-start journal (REQ-GG-10): what a fresh agent with only the repo got right and where the repo does not describe itself; six issues, two decided in HDR-011.
    read_when: running the next cold-start round; judging whether onboarding works; deciding the open issues (checks not run, the private README link, the AI-or-self rule).
  - path: docs/grootboek/hdr/hdr-012-no-record-dated-after-today.md
    what: Why docs:check fails on a record dated after today (read in Europe/Amsterdam), what it reads and what it cannot catch; the maatregel of the date-assumed incident pattern.
    read_when: writing a date in a record or register; a docs:check error about a date after today; changing the timezone constant.
  - path: docs/grootboek/hdr/hdr-013-modern-web-guidance-trial.md
    what: Trial of Modern Web Guidance on the bubble animation; the agent's baseline is written before the guidance is consulted, then the human keeps, switches off or adjusts it.
    read_when: considering web-platform guidance tooling for the agent; closing JNL-003 K10.
  - path: docs/grootboek/adr/adr-001-environment-and-deployment-topology.md
    what: main is production, other branches preview by default, secret env vars Production-only; configured in Vercel, not in the repo.
    read_when: changing branch or env-var setup in Vercel.
  - path: docs/grootboek/adr/adr-002-routes-unauthenticated-for-now.md
    what: No caller auth or rate limit on the server routes; accepted for now, provisional, superseded once K7 lands a fix.
    read_when: touching the server routes' exposure; picking up K7.
  - path: docs/grootboek/adr/adr-003-gemini-flash-lite-on-price.md
    what: Why gemini-3.1-flash-lite, and that it was chosen on price without an extensive model comparison.
    read_when: considering a different model for chat or evaluation.
  - path: docs/grootboek/adr/adr-004-google-tts-key-as-header.md
    what: GOOGLE_CLOUD_API_KEY moved from a URL query parameter to the x-goog-api-key header; confirmed against the live endpoint first.
    read_when: touching src/lib/tts/google.ts or its auth.
  - path: docs/grootboek/software-architectuur.md
    what: Technical balance v1.0 (accepted 2026-10-20), derived from the code: components, data flow, environments, auth matrix, choices. Open questions are in JNL-001. Not yet checked for drift.
    read_when: working on routes, providers, deployment or env vars; when running the drift trial.
  - path: docs/grootboek/journaal/jnl-001-instap-software-balans.md
    what: Onboarding journal for the software balance trial; eight issues (balance vs plan, environments, route auth and its follow-up, CI and its follow-up, model choice, Google key).
    read_when: accepting or discarding the balance; answering one of its open questions.
  - path: docs/grootboek/journaal/jnl-003-chat-bubble-animation.md
    what: Discovery journal for animating the chat bubbles (plan open question 11): the surviving element, growing in height and width, scroll, read-along, roles; ten issues.
    read_when: working on bubble or thread animation; answering one of its open issues.
  - path: docs/grootboek/dft/dft-001-eerste-reconciliatie-software-balans.md
    what: First drift reconciliation of the software balance; no drift found, because no code changed since the balance was written. Tested the process, not detection.
    read_when: running or interpreting the next reconciliation of the balance.
  - path: docs/grootboek/dft/dft-002-guard-blocks-claude-md-under-src.md
    what: Resolved drift report; the subagent-tenzij hook blocked CLAUDE.md files under src/ for the lead thread while the working agreement exempts non-code files. Fixed by letting the hook allow Markdown; the first drift report to run booking, decision, change and closure.
    read_when: touching guard-kenniswerker or the working-model line in CLAUDE.md; looking for an example of a drift report followed up to the end.
  - path: docs/grootboek/specs/incident-register.md
    what: Plan for the front half of the immune system (REQ-GG-06): an incident register grouped by pattern, a counter that warns at three without a codified fix, a logging duty, and the first use on naming-precision. Throwaway once built.
    read_when: building or changing the incident register or its counter; logging an incident.
  - path: docs/grootboek/specs/drift-signal.md
    what: Plan for a drift signal (REQ-GG-05): a werkgebied field in the front matter of a leading document, a script that lists the code changes in that scope since the document was last touched, and a warning in docs:check. Throwaway once built.
    read_when: building or changing the drift signal; adding werkgebied to a leading document.
  - path: docs/grootboek/specs/automatic-renumbering-on-merge.md
    what: Plan for making HDR-005's renumbering mechanical: a duplicate-id check in docs:check, a renumber script, and a hook that stops merges of arc/arc-main or main until it has run. Throwaway once built.
    read_when: building or changing the renumber script, the duplicate-id check or the merge hook.
  - path: docs/grootboek/dft/dft-003-renumber-script-misses-source-files.md
    what: Drift report; the renumber script rewrote only documents, while HDR-005 promises code comments too. Fixed in the script; stays in progress until the three stale comments on arc/bubble-animation are corrected.
    read_when: touching renumber-records.mjs or the REWRITABLE file types; checking whether the three stale JNL-002 comments in src/ are fixed.
  - path: docs/grootboek/registers
    what: YAML registers (adr, hdr, pdr, dft, jnl) — the cheap index of the grootboek; read before opening a record.
    read_when: looking for a decision, its status or an open drift report in the grootboek.
  - path: docs/ios-stt-runs.md
    what: Record of speech-recognition test runs on an iPhone.
    read_when: touching src/lib/stt or the native-STT mitigations.
  - path: spikes/ai-voice-demo/findings.md
    what: The four non-obvious bugs already paid for, and the provider comparison.
    read_when: before touching voice code.
  - path: src/components/CLAUDE.md
    what: Design system and component rules.
    read_when: loads by itself when working in src/components.
  - path: src/lib/CLAUDE.md
    what: State machine and provider rules.
    read_when: loads by itself when working in src/lib.
  - path: .claude/rules/code-style.md
    what: Code style.
    read_when: loads by itself when a file in src is touched.
  - path: .claude/rules/safari-ios.md
    what: The Safari / iPhone rules in short form.
    read_when: loads by itself for components, hooks, STT code and CSS.
  - path: .claude/agents/builder.md
    what: Agent that implements one bounded task inside a file boundary; reports in seven fields.
    read_when: delegating a build task, alone or in parallel with other builders.
  - path: .claude/agents/reviewer.md
    what: Read-only agent that checks a builder diff against its assignment.
    read_when: after each task that matters, before the work reaches Jaron.
  - path: scripts/check-docs.mjs
    what: Drift check between docs and repo (env vars, paths, register, plan staleness).
    read_when: `npm run docs:check` fails or a new kind of drift needs checking.
  - path: .claude/skills/stage-review/SKILL.md
    what: End-of-stage cold review procedure.
    read_when: closing a build stage.
  - path: .claude/skills/grootboek/SKILL.md
    what: ARC's grootboek skill (v1.5, copied from the ARC MCP resource arc://skill/grootboek/1.5): writing guides and examples per document type, registers, drift. Its text is Dutch.
    read_when: writing or updating any document under docs/grootboek.

# Headings in docs/plan.md, by topic. Search for the heading; line numbers would drift.
plan_sections:
  - heading: "## Fixed constraints"
    topic: what was specified up front and is not an open question
  - heading: "## Decisions"
    topic: the standing choices, with the reason (framework, hosting, persistence, styling, state, providers, errors)
  - heading: "## State model"
    topic: session and turn states
  - heading: "## Config flow"
    topic: how session config reaches the screens
  - heading: "## File layout"
    topic: the folder tree
  - heading: "## Design system"
    topic: tokens, reset and element CSS carried over from the existing app, and the deltas
  - heading: "## Safari/iPhone requirements"
    topic: the numbered requirements and the recording-format resolution
  - heading: "## Next.js 16 specifics"
    topic: what differs from Next 14/15
  - heading: "## Build stages"
    topic: stages 1 to 4 and their status
  - heading: "## Open questions"
    topic: what is not decided
  - heading: "## Decision log"
    topic: dated changes after approval, with the Source column (agent, you, ported)
  - heading: "## Keeping the experiment honest"
    topic: what the agent may and may not read from the reference repo

# Decisions that have a row in plan.md "Decisions". Name -> where the reason is.
decisions:
  - name: Framework (Next.js 16, TypeScript strict)
    where: "docs/plan.md, ## Decisions"
  - name: Hosting (Vercel)
    where: "docs/plan.md, ## Decisions"
  - name: Persistence (none)
    where: "docs/plan.md, ## Decisions"
  - name: Styling (CSS Modules over the ported design system)
    where: "docs/plan.md, ## Decisions"
  - name: State (one useReducer session machine)
    where: "docs/plan.md, ## Decisions"
  - name: STT and TTS providers behind registries
    where: "docs/plan.md, ## Decisions; src/lib/CLAUDE.md"
  - name: Decisions are kept in plan.md
    where: "docs/adr/0001-decisions-live-in-the-plan.md"

# What must change together. The check script verifies the first two mechanically.
travels_together:
  - when: a process.env variable is added or removed in src
    also: .env.example and the env block in README.md
  - when: a file is added under docs/ or a path in this register moves
    also: this file
  - when: code changes a choice that plan.md records
    also: docs/plan.md and a Decision log row, in the same commit
