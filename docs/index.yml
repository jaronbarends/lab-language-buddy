# Standing decisions and where the reason is. The records in docs/grootboek are leading;
# find the rest through the registers in docs/grootboek/registers/.
decisions:
  - name: Framework (Next.js 16, TypeScript strict)
    where: "docs/grootboek/adr/adr-013-nextjs-16-met-typescript-strict.md"
  - name: Hosting (Vercel)
    where: "docs/grootboek/adr/adr-014-hosting-vercel.md"
  - name: Persistence (none)
    where: "docs/grootboek/pdr/pdr-002-geen-persistentie.md"
  - name: Styling (CSS Modules over the ported design system)
    where: "docs/grootboek/adr/adr-015-styling-css-modules.md"
  - name: State (one useReducer session machine)
    where: "docs/grootboek/adr/adr-018-sessiestate-een-reducer.md"
  - name: STT and TTS providers behind registries
    where: "docs/grootboek/adr/adr-009-stt-providerkeuze-en-configuratie.md, docs/grootboek/adr/adr-020-tts-providers-en-stemmen.md; src/lib/CLAUDE.md"

# What must change together. The check script verifies the first two mechanically.
travels_together:
  - when: a process.env variable is added or removed in src
    also: .env.example and the env block in README.md
  - when: a file is added under docs/ or a path in this register moves
    also: this file
  - when: code changes a choice that a grootboek record holds
    also: that record (update or supersede it), in the same commit
