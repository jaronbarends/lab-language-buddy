# Register van de documentatie. Lees dit eerst en open daarna alleen het document dat je nodig hebt.
# `npm run docs:check` controleert dat elk pad hieronder bestaat en dat geen document onder
# docs/ in de lijst ontbreekt. Houd het bij in dezelfde commit als de wijziging.

documents:
  - path: README.md
    what: Voordeur. Wat de app is, voor wie hij is, de stack, hoe je hem draait en de bouwstappen.
    read_when: eerste kennismaking met de repo; je wijzigt env vars of de stacktabel.
  - path: CLAUDE.md
    what: Werkafspraken (taal, commits, branches, checks) en de kaart van de contextlagen.
    read_when: altijd geladen.
  - path: AGENTS.md
    what: Waarschuwing dat deze Next.js-versie afwijkt van wat het model kent; lees eerst node_modules/next/dist/docs.
    read_when: altijd geladen; voordat je Next.js-code schrijft.
  - path: docs/code-architectuur.md
    what: Doctrine voor code-organisatie (REQ-AH-10, agentic harnas onderdeel D) — alleen kwalitatieve regels, geen drempels of register.
    read_when: je een bestand splitst of laat groeien; voordat je een nieuw structuurpatroon toevoegt.
  - path: docs/code-architectuur-register.json
    what: Machineleesbaar contract (REQ-AH-11) — waarschuwings- en harde drempels en de besluiten per bestand over plafond en uitsluiting. Regelaantallen zijn een momentopname; REQ-AH-12 maakt ze live gemeten.
    read_when: een bestand over de waarschuwingsdrempel gaat; je een plafondbesluit vastlegt of herziet.
  - path: docs/grootboek/CLAUDE.md
    what: Regels voor de grootboekmap — documenttypes, conventies, communicatieplicht.
    read_when: laadt vanzelf bij werk in docs/grootboek.
  - path: docs/grootboek/hdr/hdr-001-grootboek-stelsel.md
    what: Waarom het grootboek naast plan.md bestaat en welke beslissingen het bevat (vanaf 2026-10-20).
    read_when: je beslist of een beslissing in het grootboek of in plan.md hoort.
  - path: docs/grootboek/hdr/hdr-002-balans-naast-plan-driftproef.md
    what: Waarom de technische balans wordt bijgehouden, als proef van de driftdetectie van het grootboek; plan.md blijft de bron tot de proef is afgerond.
    read_when: je beslist of de balans blijft, wijzigt of vervalt; voor de driftproef.
  - path: docs/grootboek/hdr/hdr-003-ci-checks-op-pull-requests.md
    what: Besluit dat lint, typecheck, docs:check, test:scripts, register:check en build op PR's naar main draaien; gebouwd op 2026-10-22 in .github/workflows/checks.yml (K8).
    read_when: je CI voor deze repo inricht.
  - path: docs/grootboek/hdr/hdr-004-sessiegebonden-refactor-loop.md
    what: Waarom de refactor loop van REQ-AH-13 een sessiegebonden PreToolUse-hook is en niet de onbewaakte push-hook op git-niveau van ARC (geweigerd door de safety classifier).
    read_when: je de refactor loop aanraakt; je een andere ARC-harnasconventie overneemt.
  - path: docs/grootboek/hdr/hdr-005-hernummeren-bij-merge-bij-botsende-nummers.md
    what: Regel voor parallelle branches die hetzelfde recordnummer boeken; de branch die als tweede merget hernummert zijn eigen records, in zijn eigen branch.
    read_when: je een branch merget die grootboekrecords heeft geboekt; je een nieuw record nummert.
  - path: docs/grootboek/hdr/hdr-006-communicatieplicht-hook.md
    what: Waarom een PostToolUse-hook de agent aan de communicatieplicht herinnert als een leidend document wijzigt; waar de lijst staat, de blinde vlekken, de tekst voor subagents.
    read_when: je de lijst van leidende documenten wijzigt; je notify-leading-document of leading-documents.json aanraakt.
  - path: docs/grootboek/hdr/hdr-007-mechanisch-hernummeren.md
    what: Waarom het hernummeren van records een script is, met een controle op dubbele ids en een merge-guardhook, en waarom de volgorde eerst hernummeren, dan mergen is (draait de stappen van HDR-005 om).
    read_when: je main in een branch merget; je renumber-records, de guard-merge-renumber-hook of de controle op dubbele ids aanraakt.
  - path: docs/grootboek/hdr/hdr-008-driftsignaal.md
    what: Waarom leidende documenten een werkgebied declareren en een script meldt wanneer de code daarin is gewijzigd; signaal, geen oordeel, gevolgd door een reconciliatie en een DFT (REQ-GG-05). De baseline is vervangen door HDR-022.
    read_when: je drift-signal of het werkgebied-veld aanraakt; je een reconciliatie uitvoert; je een nieuwe balans maakt.
  - path: docs/grootboek/hdr/hdr-022-drift-gemeten-vanaf-de-reconciliatie.md
    what: Besluit dat het driftsignaal meet vanaf de laatste afgesloten reconciliatie (DFT-register, velden documenten en getoetst-tegen) in plaats van de laatste aanraking, en dat de CLAUDE.md-bestanden onder src/ eronder vallen.
    read_when: je een driftsignaal opvolgt of een reconciliatie als DFT boekt; je drift-signal.mjs of het DFT-register aanraakt.
  - path: docs/grootboek/hdr/hdr-023-open-driftrapport-meldt-zich.md
    what: Besluit dat docs:check waarschuwt bij een DFT die langer dan veertien dagen open of in_progress staat; de maatregel van het incidentpatroon promised-follow-up-dropped, samen met HDR-022.
    read_when: docs:check meldt een open DFT; je de leeftijdscheck in check-docs aanraakt; je een DFT open laat staan.
  - path: docs/grootboek/hdr/hdr-009-incidentregister.md
    what: Waarom terugkerende fouten per patroon in een incidentregister worden gelogd en bij drie worden vastgelegd (REQ-GG-06); de drempel, wat er bij drie gebeurt en waarom het loggen van de agent afhangt.
    read_when: je een incident logt; je het incidentregister of de teller aanraakt; een docs:check-waarschuwing over een patroon.
  - path: docs/grootboek/hdr/hdr-010-namen-getoetst-aan-wat-ze-beloven.md
    what: De naamgevingsregel in code-style.md en waarom — zeven naamcorrecties in de review van stage 4, het eerste patroon dat via het incidentregister is vastgelegd.
    read_when: je een functie, status of type in src/ een naam geeft; een naamcorrectie van Jarón.
  - path: docs/grootboek/hdr/hdr-011-arc-basisbranch-en-eerst-de-branch.md
    what: Historisch: waarom de root-CLAUDE.md arc/arc-main noemde als basis voor arc-werk en zegt dat de branch vóór de eerste bewerking komt; gevonden in de eerste koude-startrun. Het eerste deel is vervangen door HDR-021 (werk vertakt van main); het tweede deel geldt nog.
    read_when: je de geschiedenis van de basisbranch zoekt; voor de regel om een branch te maken, zie HDR-021.
  - path: docs/grootboek/journaal/jnl-002-koude-start-onboarding.md
    what: Koude-startjournaal (REQ-GG-10) — wat een verse agent met alleen de repo goed deed en waar de repo zichzelf niet beschrijft; zes kwesties, twee besloten in HDR-011.
    read_when: je de volgende koude-startronde draait; je beoordeelt of onboarding werkt; je de open kwesties beslist (checks niet gedraaid, de privé README-link, de AI-of-zelf-regel).
  - path: docs/grootboek/hdr/hdr-012-geen-record-gedateerd-na-vandaag.md
    what: Waarom docs:check faalt op een record dat na vandaag is gedateerd (gelezen in Europe/Amsterdam), wat het leest en wat het niet kan vangen; de maatregel van het incidentpatroon date-assumed.
    read_when: je een datum in een record of register schrijft; een docs:check-fout over een datum na vandaag; je de tijdzoneconstante wijzigt.
  - path: docs/grootboek/hdr/hdr-013-modern-web-guidance-proef.md
    what: Proef met Modern Web Guidance op de bubbelanimatie; de baseline van de agent wordt geschreven voordat de guidance wordt geraadpleegd, daarna houdt de mens de guidance, zet hij haar uit of past hij haar aan.
    read_when: je guidance-tooling voor het webplatform voor de agent overweegt; je JNL-003 K10 afsluit.
  - path: docs/grootboek/hdr/hdr-014-documentatie-nederlands.md
    what: Welke taal waar geldt (documentatie Nederlands; code, UI, commits, README, AGENTS.md en spikes Engels), dat vertalen geen nieuwe beslissing is, en welke labels niet vertaald worden.
    read_when: je een document schrijft of vertaalt; je twijfelt over de taal van een tekst; je de taalregels in een CLAUDE.md wijzigt.
  - path: docs/grootboek/hdr/hdr-015-plan-vervalt-als-bron.md
    what: Waarom plan.md als bron vervalt en hoe de inhoud naar het grootboek gaat (keuzes, controle op volledigheid, bevriezen en verwijderen); vervangt ADR 0001.
    read_when: je een beslissing zoekt die vroeger in plan.md stond; je aan de overzetting werkt; je verwijzingen naar plan.md bijwerkt.
  - path: docs/grootboek/hdr/hdr-016-bestaande-repo-geen-bron.md
    what: De regel dat de agent de bestaande Language Buddy-repo niet als bron gebruikt tenzij Jarón een bestand aanwijst, met de reden en het archief van wat de agent eerder zag.
    read_when: je overweegt in de bestaande repo te kijken; Jarón wijst naar een bestand daaruit; je de werkafspraken in CLAUDE.md wijzigt.
  - path: docs/grootboek/pdr/pdr-001-app-in-gebruik-en-werkwijze-experiment.md
    what: Waarvoor het project bestaat (een app voor dagelijks gebruik en een experiment in werkwijze) en dat de bestaande Language Buddy-app geen bron meer is.
    read_when: je twijfelt over het doel van het project; je de README of het experiment-kader in CLAUDE.md aanpast; je afweegt of je de bestaande app moet raadplegen.
  - path: docs/grootboek/pdr/pdr-002-geen-persistentie.md
    what: Waarom de app niets bewaart (sessiestate in het geheugen, geschiedenis bij Google) en wat dat kost; overgezet uit plan.md.
    read_when: je overweegt opslag, accounts of een gespreksgeschiedenis toe te voegen.
  - path: docs/grootboek/pdr/pdr-003-een-set-bediening-zonder-stop.md
    what: Waarom het live transcript in de control bar staat en er geen Stop-knop is; overgezet uit plan.md (proefrecord).
    read_when: je de bediening, de control bar of het live transcript wijzigt; iets in de bediening willekeurig lijkt.
  - path: docs/grootboek/pdr/pdr-004-tekst-in-spraakbubbels.md
    what: Regelhoogte 1.25 en gewicht medium voor alle spraakbubbels, met de ingehaalde stap naar 1.3; overgezet uit plan.md (proefrecord).
    read_when: je de typografie van bubbels, de conceptbubbel of de regelhoogte-token wijzigt.
  - path: docs/grootboek/adr/adr-006-editing-eigen-beurtstatus.md
    what: Waarom editing een eigen beurtstatus is met draftBeforeEdit (Cancel edit moet de oude tekst terugzetten); overgezet uit plan.md (proefrecord).
    read_when: je de beurtstatussen of de reducer wijzigt; je overweegt editing samen te voegen met een andere state.
  - path: docs/grootboek/adr/adr-005-taalkiezer-uit-de-bestaande-app.md
    what: Waarom de taalkiezer in zijn geheel uit de bestaande app is overgenomen (native radio, fieldset, :has()); overgezet uit plan.md (proefrecord).
    read_when: je de taalkiezer of zijn markup wijzigt.
  - path: docs/grootboek/adr/adr-007-evaluatie-per-beurt-eigen-call.md
    what: De evaluatie per gebruikersbeurt in een eigen call naar /api/evaluation, met de drie-weg-vergelijking, de metingen en de keuze om de corrector het hele gesprek te geven; overgezet uit plan.md.
    read_when: je de evaluatie-route, de twee parallelle calls of de context van de corrector wilt begrijpen of wijzigen.
  - path: docs/grootboek/pdr/pdr-005-hoe-de-correctie-eruitziet.md
    what: Uiterlijk en inhoud van de correctie onder de gebruikersbubbel: kleur, segmenttypes, cursief en achtergrond, placeholders en markup; overgezet uit plan.md.
    read_when: je het correctiegedeelte (evaluation-section) of de vorm van correction wijzigt.
  - path: docs/grootboek/adr/adr-008-prompts-van-de-corrector.md
    what: Opbouw en regels van de prompts van chat en corrector (spelling, null-regel, message-verpakking, geen code-guard); overgezet uit plan.md.
    read_when: je de prompts in src/lib/prompt.ts of de evaluatie-call wijzigt.
  - path: docs/grootboek/pdr/pdr-006-antwoord-pas-na-de-correctie.md
    what: Het antwoord van de AI verschijnt pas nadat de correctie is getoond (pendingReply), met de time-out van 10 seconden en geen vooraf ophalen van TTS-audio; overgezet uit plan.md.
    read_when: je de volgorde van correctie en antwoord, de pendingReply-regel of het begin van TTS-weergave wilt wijzigen.
  - path: docs/grootboek/adr/adr-009-stt-providerkeuze-en-configuratie.md
    what: STT als providerkeuze (native, deepgram, elevenlabs) via NEXT_PUBLIC_STT_PROVIDER, met default, foutgedrag en naamgeving; overgezet uit plan.md.
    read_when: je de STT-provider wilt kiezen of wijzigen, of wilt weten waarom native de default is.
  - path: docs/grootboek/adr/adr-010-native-engine-op-iphone.md
    what: Wat de native STT-engine doet als de browser een sessie zelf beëindigt (herstart, snelle einden) en de twee iPhone-mitigaties (vroege pauze van 0,15 s, gehouden microfoonstream); overgezet uit plan.md.
    read_when: je het native STT-gedrag of de iPhone-mitigaties in use-audio-playback.ts of native.ts wijzigt, of vraagt waarom de speech 0,15 s eerder stopt.
  - path: docs/grootboek/adr/adr-011-deepgram-provider.md
    what: De Deepgram-provider: token-mint in de route, alleen webm of ogg, geen flush, eigen module in src/lib/stt en een afbreekbare tokenaanvraag; overgezet uit plan.md.
    read_when: je Deepgram-transcriptie, de tokenroute of het opnameformaat wijzigt.
  - path: docs/grootboek/adr/adr-012-elevenlabs-scribe-provider.md
    what: De ElevenLabs Scribe-provider: PCM via AudioWorklet, tokenroute, fatale berichttypes, streamingAudioHasStarted en wat op de iPhone wel en niet is getest; overgezet uit plan.md.
    read_when: je de ElevenLabs STT-provider of zijn tokenroute wijzigt.
  - path: docs/grootboek/adr/adr-013-nextjs-16-met-typescript-strict.md
    what: De keuze voor Next.js 16 (App Router) met TypeScript strict en React 19; overgezet uit plan.md.
    read_when: je het framework, de TypeScript-strictheid of de reden voor de serverroutes onder src/app/api wilt weten.
  - path: docs/grootboek/adr/adr-014-hosting-vercel.md
    what: De keuze om de app op Vercel te hosten, met de reden; overgezet uit plan.md.
    read_when: je wilt weten waarom Vercel is gekozen en waarom de app geen langlevend serverproces of WebSocket-server nodig heeft.
  - path: docs/grootboek/adr/adr-015-styling-css-modules.md
    what: De keuze om te stylen met CSS Modules over het overgenomen design system, niet met Tailwind; overgezet uit plan.md.
    read_when: je twijfelt of je Tailwind of een andere styling-aanpak moet gebruiken.
  - path: docs/grootboek/adr/adr-016-vlaggen-flag-icons.md
    what: De vlaggen komen uit flag-icons, met alleen de zes benodigde SVG's geïmporteerd; overgezet uit plan.md.
    read_when: je vlaggen of talen in de UI toevoegt of de import van flag-icons aanraakt.
  - path: docs/grootboek/hdr/hdr-017-geen-testsuite-behalve-scripts.md
    what: De app heeft geen testsuite, maar scripts die documenten herschrijven krijgen wel een node:test-test; overgezet uit plan.md.
    read_when: je overweegt tests toe te voegen of een script schrijft dat documenten herschrijft.
  - path: docs/grootboek/hdr/hdr-018-contextlagen-en-drift-check.md
    what: Waarom de context van het project gelaagd is (rules, CLAUDE.md per map, register, agents) en hoe npm run docs:check drift in de documentatie afdwingt; overgezet uit plan.md.
    read_when: je de lagen van de context wijzigt, een nieuw document registreert of de docs:check aanpast.
  - path: docs/grootboek/hdr/hdr-019-stage-verifieren-op-iphone.md
    what: Elke bouwstap wordt op iPhone Safari geverifieerd, met voor live STT een uiting van meer dan 20 seconden; overgezet uit plan.md.
    read_when: je een STT-provider toevoegt of wisselt en wilt weten wat er op de telefoon gecontroleerd moet worden.
  - path: docs/grootboek/hdr/hdr-021-werk-vertakt-van-main.md
    what: Besluit dat arc/arc-main vervalt en elke branch van main vertrekt en via een pull request terugkeert naar main.
    read_when: je een branch maakt of merget, of het hernummeren, de CI-trigger of de merge-hook aanraakt.
  - path: docs/grootboek/hdr/hdr-020-faalpaden-bewust-proberen.md
    what: Bij elke stage worden de faalpaden bewust geprobeerd en moeten ze in een herstelbare error-state landen; overgezet uit plan.md.
    read_when: je een stage verifieert of wilt weten welke faalpaden je met de hand probeert.
  - path: docs/grootboek/hdr/hdr-024-builder-model-per-regime.md
    what: Welk model de builder per triage-regime krijgt (Sonnet bij trivial, Opus bij normal en risky), met de proef die dat besliste en wat een hertest vooraf moet afspreken.
    read_when: je een builder start; je de staffel, builder.md of de triage-skill wijzigt; je een ander model voor een agent overweegt of de proef voor normal opnieuw draait.
  - path: docs/grootboek/hdr/hdr-025-bewering-uit-de-bron.md
    what: De werkafspraak dat een bewering over een document of de omgeving uit de bron komt, niet uit een zoekresultaat, indexregel of geheugennotitie; de maatregel van het incidentpatroon document-not-fully-read, en waarom een regel en geen hook.
    read_when: je beweert wat een document zegt of wat de omgeving heeft; een correctie van Jarón op zo'n bewering; je overweegt het patroon tot een hook te laten doorgroeien.
  - path: docs/grootboek/pdr/pdr-007-persona-van-de-ai.md
    what: De AI is een algemene vriendelijke kennis met vrij onderwerp, 2 tot 4 zinnen en hooguit één vraag per beurt; overgezet uit plan.md.
    read_when: je de persona, de toon of de prompt-opbouw uit benoemde secties wijzigt of een nieuwe persona toevoegt.
  - path: docs/grootboek/pdr/pdr-008-knoppen.md
    what: Twee knopvarianten met eigen uitgeschakelde stijl, Reply als primaire knop en horizontale padding 16px; overgezet uit plan.md.
    read_when: je de knopvarianten, de kleur van Reply of de breedte en padding van knoppen op een telefoon wijzigt.
  - path: docs/grootboek/pdr/pdr-009-de-live-indicator.md
    what: De stip in de luisterbubbel duidt de live microfoon aan, pulseert via een ring en vervangt de gestippelde rand; overgezet uit plan.md.
    read_when: je het live transcript, de stip of de pulse-animatie wijzigt.
  - path: docs/grootboek/pdr/pdr-010-sessieflow-en-schermen.md
    what: Besluiten over de sessieflow: geen ended-fase, lastConfig als nieuwe standaard, Start conversation als eerste beurt, Reply tijdens aiSpeaking; overgezet uit plan.md.
    read_when: je de overgang tussen setup en gesprek, het label van de eerste knop of het onderbreken van de AI-spraak wilt begrijpen of wijzigen.
  - path: docs/grootboek/pdr/pdr-011-scroll-en-tekstvakken.md
    what: Hoe de thread scrolt bij een te hoge bubbel, de hoogtebegrenzing van de tekst in de bediening en flex-shrink 0 op .bubble; overgezet uit plan.md.
    read_when: je het scrollgedrag van de thread, de hoogtebegrenzing van live transcript, concept of editor, of het klippen van bubbels aanraakt.
  - path: docs/grootboek/adr/adr-017-de-bubbel-en-het-bewerkvak.md
    what: Het gedeelde Bubble-frame, het ongecontroleerde contenteditable-bewerkvak, wit bij bewerken en pre-line voor regeleinden; overgezet uit plan.md.
    read_when: je het frame van een spraakbubbel, het bewerkvak of de witruimte in bubbels wijzigt.
  - path: docs/grootboek/adr/adr-018-sessiestate-een-reducer.md
    what: De sessiestate als één reducer, de beurtstatus als discriminated union, een UUID per beurt en de turnId op de AI_SPEECH-acties; overgezet uit plan.md.
    read_when: je de sessiestate, de reducer-acties of de identiteit van beurten wijzigt of een state context overweegt.
  - path: docs/grootboek/adr/adr-019-chat-api-en-gespreksgeschiedenis.md
    what: De chat-API en de gespreksgeschiedenis (ketting via previous_interaction_id, system instruction op de server, request als union op kind); overgezet uit plan.md.
    read_when: je het chat-endpoint, het request- of foutschema of de manier waarop de gespreksketting loopt wijzigt.
  - path: docs/grootboek/adr/adr-020-tts-providers-en-stemmen.md
    what: De drie TTS-providers, de provider-interface, de stemtabellen per provider, de stemkeuze en de tekstlimiet van /api/tts; overgezet uit plan.md.
    read_when: je een TTS-provider of stem toevoegt of wijzigt, of de interface of limiet van /api/tts aanpast.
  - path: docs/grootboek/adr/adr-021-fouten-en-herstel.md
    what: Herstelbare fouten: de fout-state met from, wat als falen telt, fouten op de server en in de browser, en de time-outs; overgezet uit plan.md.
    read_when: je de foutflow, Try again, de time-outs (verbinding, chat, evaluatie) of de TTS-degradatie wijzigt.
  - path: docs/grootboek/pdr/pdr-015-markering-van-het-gesproken-woord.md
    what: Hoe het gesproken woord in een spraakbubbel wordt gemarkeerd (gradient, witruimte, forced-colors, woordtimings); overgezet uit plan.md.
    read_when: je de markering van het gesproken woord, de bijbehorende CSS of het moment waarop de woordtimings worden gemaakt wijzigt.
  - path: docs/grootboek/adr/adr-022-design-system-overgenomen.md
    what: Het design system (tokens, bevels, reset en elementregels) van de bestaande app is overgenomen; overgezet uit plan.md.
    read_when: je tokens, reset.css, elements.css of de diepte-stijl (bevels) van knoppen wilt begrijpen of aanpassen.
  - path: docs/grootboek/pdr/pdr-016-typografie-en-iconen.md
    what: 18px basislettergrootte, semibold labels en select, Font Awesome 6 iconen via react-icons en het waarschuwingsicoon in de foutbox; overgezet uit plan.md.
    read_when: je typografie (lettergrootte, labelgewicht) of de iconen en de opmaak van de foutbox wijzigt.
  - path: docs/grootboek/pdr/pdr-017-contrast-en-forced-colors.md
    what: Welke contrastparen onder de WCAG-drempel bewust zijn geaccepteerd en hoe geselecteerde opties zich in forced-colors-modus gedragen; overgezet uit plan.md.
    read_when: je het contrast van knoppen, opties of randen wilt aanpassen, of forced-colors-stijlen wijzigt.
  - path: docs/grootboek/pdr/pdr-018-geen-open-microfoonmodus.md
    what: Besluit dat de app geen open-microfoonmodus heeft en de AI niet te onderbreken is door erdoorheen te praten; overgezet uit plan.md.
    read_when: je doorlopende opname overweegt of het onderbreken van de AI door erdoorheen te praten.
  - path: docs/grootboek/pdr/pdr-019-screenreaders-zijn-geen-doel.md
    what: Besluit dat screenreaders (VoiceOver voorop) geen doel van de app zijn — niet testen, niet als bevinding of open kwestie opvoeren; bestaande rollen en labels blijven, ongegarandeerd.
    read_when: je een review doet of een kwestie opent over wat een screenreader aankondigt, of ARIA-rollen en labels wijzigt.
  - path: docs/grootboek/adr/adr-023-safari-safe-area-en-beperkingen.md
    what: De bovenste safe-area-inset en de geaccepteerde Safari/iPhone-beperkingen (landscape, bediening onder het toetsenbord); overgezet uit plan.md.
    read_when: je aan de layout van het setup- of gesprekscherm op iPhone, aan safe-area-insets of aan het toetsenbordgedrag in editing werkt.
  - path: docs/grootboek/adr/adr-024-taalregistry.md
    what: De velden van de taalregistry (htmlLang, deepgramLang, webSpeechLang, elevenLabsLang) en de controle bij het toevoegen van een taal; overgezet uit plan.md.
    read_when: je een taal toevoegt of wijzigt, of een lang-attribuut of een taalcode voor een STT-provider nodig hebt.
  - path: docs/grootboek/adr/adr-025-mockmodus-voor-ontwikkeling.md
    what: De mockmodus voor ontwikkeling: mockschakelaars en -routes, gedrag van de mockantwoorden en de dev-stepper; overgezet uit plan.md.
    read_when: je met de mockschakelaars, de mockroutes of de dev-stepper werkt, of wilt weten waarom ze zo werken.
  - path: docs/grootboek/adr/adr-026-safari-iphone-eisen.md
    what: De zes Safari/iPhone-eisen die in de app zijn ingebouwd, met de afhandeling van het opnameformaat en de uitwijkroute; overgezet uit plan.md.
    read_when: je recording, audio unlock, layout op iOS, focusbare controls of het bewerkbare bubbelveld aanraakt.
  - path: docs/grootboek/adr/adr-027-cachecomponents-blijft-uit.md
    what: Waarom cacheComponents in Next.js 16 uitgeschakeld blijft; overgezet uit plan.md.
    read_when: je cacheComponents of PPR wilt aanzetten, of buildfouten over data buiten Suspense tegenkomt.
  - path: docs/grootboek/adr/adr-028-reducer-negeert-late-acties.md
    what: De reducer negeert late acties in plaats van te gooien; overgezet uit plan.md.
    read_when: je een actie of state aan de reducer toevoegt.
  - path: docs/grootboek/adr/adr-030-evaluatie-is-een-veld-van-de-beurt.md
    what: De evaluatie van een gebruikersbeurt is een veld van de beurt in plaats van een beurtstatus, met pendingReply voor de volgorderegel; overgezet uit plan.md.
    read_when: je het evaluatieveld of de volgorde tussen correctie en antwoord in de reducer wijzigt, of wilt weten waarom evaluatie geen beurtstatus is.
  - path: docs/grootboek/adr/adr-031-ai-bubbel-blijft-een-element.md
    what: De AI-bubbel is één element van wachten tot antwoord — key op positie (ai-<n>), in dezelfde array als de beurten, layout meteen op de eindmaat en alleen scale animeert; uit JNL-003 K2 en K4.
    read_when: je de keys of de opbouw van de thread wijzigt, een actie toevoegt die een beurt verwijdert of tussenvoegt, of de positiekey naar turn.id wilt "repareren".
  - path: docs/grootboek/adr/adr-029-geen-mock-stt.md
    what: Besluit dat er geen mock voor speech-to-text komt, omdat de Edit-bediening getypte invoer dekt; overgezet uit plan.md.
    read_when: je een mock-STT-schakelaar of -route wilt toevoegen naast de mocks voor chat en TTS.
  - path: docs/grootboek/pdr/pdr-012-setup-formulier.md
    what: Hoe het setup-scherm is opgebouwd: één form, fieldset en legend per veld, aria-labelledby op de select, native radio's met anchor-indicator, mask-pijl, breedte van Start chat; overgezet uit plan.md.
    read_when: je het setup-scherm, de starter-toggle, de niveau-select of de breedte van de Start chat-knop wijzigt.
  - path: docs/grootboek/pdr/pdr-013-animatie-van-bubbels.md
    what: Hoe bubbels inanimeren (gebruiker, denkbubbel, antwoord) met scale, en waarom zo; overgezet uit plan.md.
    read_when: je de animatie, de timings of de variabelen van de bubbelonthulling aanpast.
  - path: docs/grootboek/pdr/pdr-014-logo-en-favicons.md
    what: Favicons en manifest uit de bestaande app en het logo als inline SVG-component zonder SVGR; overgezet uit plan.md.
    read_when: je favicons, het manifest of het logo op het setup-scherm wijzigt, of overweegt een SVG-loader toe te voegen.
  - path: docs/grootboek/adr/adr-001-omgeving-en-deployment-topologie.md
    what: main is production, andere branches krijgen standaard een preview, geheime env vars gelden alleen voor Production; ingesteld in Vercel, niet in de repo.
    read_when: je de branch- of env-var-instellingen in Vercel wijzigt.
  - path: docs/grootboek/adr/adr-002-routes-zonder-authenticatie-voorlopig-geaccepteerd.md
    what: Geen authenticatie van de aanroeper of rate limit op de serverroutes; voorlopig geaccepteerd en vervangen zodra K7 een oplossing oplevert.
    read_when: je de blootstelling van de serverroutes aanraakt; je K7 oppakt.
  - path: docs/grootboek/adr/adr-003-gemini-flash-lite-op-prijs.md
    what: Waarom gemini-3.1-flash-lite, en dat het op prijs is gekozen zonder uitgebreide modelvergelijking.
    read_when: je een ander model voor chat of evaluatie overweegt.
  - path: docs/grootboek/adr/adr-004-google-tts-key-als-header.md
    what: GOOGLE_CLOUD_API_KEY is van een URL-queryparameter naar de header x-goog-api-key verhuisd; eerst bevestigd tegen het live endpoint.
    read_when: je src/lib/tts/google.ts of de auth ervan aanraakt.
  - path: docs/grootboek/software-architectuur.md
    what: Technische balans v1.0 (geaccepteerd 2026-10-20), afgeleid uit de code — componenten, datastroom, omgevingen, auth-matrix, keuzes. Open vragen staan in JNL-001. Gereconcilieerd in DFT-004 (2026-11-07, het eerste echte driftsignaal); DFT-001 was een proef zonder codewijzigingen.
    read_when: je aan routes, providers, deployment of env vars werkt; bij de driftproef.
  - path: docs/grootboek/journaal/jnl-001-instap-software-balans.md
    what: Instapjournaal voor de proef met de software-balans; acht kwesties (balans versus plan, omgevingen, route-auth en het vervolg, CI en het vervolg, modelkeuze, Google-key).
    read_when: je de balans accepteert of verwerpt; je een van de open vragen beantwoordt.
  - path: docs/grootboek/journaal/jnl-003-animatie-van-chatbubbels.md
    what: Discovery-journaal over het animeren van de chatbubbels (open vraag 11 uit het plan) — het blijvende element, groei in hoogte en breedte, scroll, meelezen, rollen; vijftien kwesties.
    read_when: je aan bubbel- of threadanimatie werkt; je een van de open kwesties beantwoordt.
  - path: docs/grootboek/journaal/jnl-004-openstaande-kwesties.md
    what: Journaal met de negen vragen die openstonden toen plan.md werd afgebouwd (tests, de Spaanse vlag, een sessie beëindigen, het afbreken bij 320px, bediening onder het toetsenbord, audio bufferen, de vastgehouden reply, de Gemini-wrappers, de native engine op iPhone), met bevindingen en metingen per kwestie.
    read_when: je een van deze kwesties oppakt of beslist of je haar accepteert, bouwt of laat vallen; je aan de native spraakherkenning op iPhone werkt (kwestie K9 bevat alle runs).
  - path: docs/grootboek/journaal/jnl-005-metingen-van-de-corrector.md
    what: Journaal met de metingen van de corrector (drie varianten, echte prompts, context van 10-10) en de zwakke plekken die gemeten maar niet opgelost zijn.
    read_when: je de cijfers achter de besluiten over de corrector nodig hebt of de spellingregel, transcriptiehint of aanhalingstekens wilt heroverwegen.
  - path: docs/grootboek/dft/dft-001-eerste-reconciliatie-software-balans.md
    what: Eerste driftreconciliatie van de software-balans; geen drift gevonden, omdat er sinds het schrijven van de balans geen code was gewijzigd. Het proces is getest, niet de detectie.
    read_when: je de volgende reconciliatie van de balans uitvoert of duidt.
  - path: docs/grootboek/dft/dft-002-guard-blokkeert-claude-md-onder-src.md
    what: Opgelost driftrapport; de subagent-tenzij-hook blokkeerde CLAUDE.md-bestanden onder src/ voor de lead thread, terwijl de werkafspraak niet-codebestanden uitzondert. Opgelost door de hook Markdown toe te laten; het eerste driftrapport dat doorliep van boeking via besluit en wijziging tot afsluiting.
    read_when: je guard-kenniswerker of de werkmodelregel in CLAUDE.md aanraakt; je een voorbeeld zoekt van een driftrapport dat tot het einde is opgevolgd.
  - path: docs/grootboek/specs/incidentregister.md
    what: Plan voor de voorste helft van het immuunsysteem (REQ-GG-06) — een incidentregister per patroon, een teller die bij drie zonder vastgelegde oplossing waarschuwt, een logplicht en het eerste gebruik op naming-precision. Wegwerpdocument zodra het gebouwd is.
    read_when: je het incidentregister of de teller bouwt of wijzigt; je een incident logt.
  - path: docs/grootboek/specs/driftsignaal.md
    what: Plan voor een driftsignaal (REQ-GG-05) — een werkgebied-veld in de front matter van een leidend document, een script dat de codewijzigingen in dat gebied opsomt sinds het document het laatst is aangeraakt, en een waarschuwing in docs:check. Wegwerpdocument zodra het gebouwd is.
    read_when: je het driftsignaal bouwt of wijzigt; je werkgebied aan een leidend document toevoegt.
  - path: docs/grootboek/specs/automatisch-hernummeren-bij-merge.md
    what: Plan om het hernummeren van HDR-005 mechanisch te maken — een controle op dubbele ids in docs:check, een renumber-script en een hook die merges van arc/arc-main of main tegenhoudt tot het is gedraaid. Wegwerpdocument zodra het gebouwd is.
    read_when: je het renumber-script, de controle op dubbele ids of de merge-hook bouwt of wijzigt.
  - path: docs/grootboek/dft/dft-003-hernummerscript-mist-bronbestanden.md
    what: Opgelost driftrapport; het renumber-script herschreef alleen documenten, terwijl HDR-005 ook codecommentaar belooft. Opgelost in het script; de drie verouderde commentaren zijn op 2026-10-27 gecorrigeerd, de DFT is pas op 2026-11-08 gesloten.
    read_when: je renumber-records.mjs of de REWRITABLE-bestandstypen aanraakt.
  - path: docs/grootboek/dft/dft-004-eerste-reconciliatie-op-een-echt-signaal.md
    what: Driftrapport; de eerste reconciliatie op een echt signaal (HDR-022). src/components/CLAUDE.md beschreef een state-context die nooit bestond, balans § 5 miste de CI, de dev-previews van de bubbels stonden niet in de balans; src/lib/CLAUDE.md klopte.
    read_when: je de regel over schermen en dispatch in src/components/CLAUDE.md, § 3 of § 5 van de balans aanraakt; je een volgende reconciliatie doet en een voorbeeld zoekt.
  - path: docs/grootboek/registers
    what: YAML-registers (adr, hdr, pdr, dft, jnl) — de goedkope index van het grootboek; lees ze voordat je een record opent.
    read_when: je een beslissing, de status ervan of een open driftrapport in het grootboek zoekt.
  - path: docs/ios-stt-runs.md
    what: Verslag van testruns met spraakherkenning op een iPhone.
    read_when: je src/lib/stt of de mitigaties voor native STT aanraakt.
  - path: spikes/ai-voice-demo/findings.md
    what: De vier niet-vanzelfsprekende bugs die al zijn betaald, en de providervergelijking.
    read_when: voordat je voice-code aanraakt.
  - path: src/components/CLAUDE.md
    what: Design system en componentregels.
    read_when: laadt vanzelf bij werk in src/components.
  - path: src/lib/CLAUDE.md
    what: Regels voor de state machine en de providers.
    read_when: laadt vanzelf bij werk in src/lib.
  - path: .claude/rules/code-style.md
    what: Codestijl.
    read_when: laadt vanzelf als een bestand in src wordt aangeraakt.
  - path: .claude/rules/nextjs-16.md
    what: Twee Next.js 16-valkuilen waarbij een verkeerde aanname geruisloos slaagt (geen export const runtime in een route, SVG-imports zijn een URL-string).
    read_when: laadt vanzelf bij werk in src/app, src/components of next.config.ts.
  - path: .claude/rules/safari-ios.md
    what: De Safari/iPhone-regels in korte vorm.
    read_when: laadt vanzelf voor components, hooks, STT-code en CSS.
  - path: .claude/agents/builder.md
    what: Agent die één afgebakende taak binnen een bestandsgrens uitvoert; rapporteert in zeven velden.
    read_when: je een bouwtaak delegeert, alleen of parallel aan andere builders.
  - path: .claude/agents/reviewer.md
    what: Alleen-lezen agent die een builder-diff toetst aan zijn opdracht.
    read_when: na elke taak die ertoe doet, voordat het werk Jarón bereikt.
  - path: scripts/check-docs.mjs
    what: Driftcontrole tussen docs en repo (env vars, paden, register, veroudering van het plan).
    read_when: "`npm run docs:check` faalt of er een nieuw soort drift gecontroleerd moet worden."
  - path: .claude/skills/stage-review/SKILL.md
    what: Procedure voor de koude review aan het einde van een stage.
    read_when: je een bouwstage afsluit.
  - path: .claude/skills/grootboek/SKILL.md
    what: De grootboek-skill van ARC (v1.5, gekopieerd uit de ARC MCP-resource arc://skill/grootboek/1.5) — schrijfgidsen en voorbeelden per documenttype, registers, drift. De tekst is Nederlands.
    read_when: je een document onder docs/grootboek schrijft of bijwerkt.

# Vaste beslissingen en waar de reden staat. De records in docs/grootboek zijn leidend;
# de rest vind je via de registers in docs/grootboek/registers/.
decisions:
  - name: Framework (Next.js 16, TypeScript strict)
    where: "docs/grootboek/adr/adr-013-nextjs-16-met-typescript-strict.md"
  - name: Hosting (Vercel)
    where: "docs/grootboek/adr/adr-014-hosting-vercel.md"
  - name: Persistentie (geen)
    where: "docs/grootboek/pdr/pdr-002-geen-persistentie.md"
  - name: Styling (CSS Modules over het overgenomen design system)
    where: "docs/grootboek/adr/adr-015-styling-css-modules.md"
  - name: State (één useReducer session machine)
    where: "docs/grootboek/adr/adr-018-sessiestate-een-reducer.md"
  - name: STT- en TTS-providers onder registries
    where: "docs/grootboek/adr/adr-009-stt-providerkeuze-en-configuratie.md, docs/grootboek/adr/adr-020-tts-providers-en-stemmen.md; src/lib/CLAUDE.md"

# Wat samen moet veranderen. Het controlescript controleert de eerste twee mechanisch.
travels_together:
  - when: een process.env-variabele in src wordt toegevoegd of verwijderd
    also: .env.example en het env-blok in README.md
  - when: er een bestand onder docs/ bijkomt of een pad in dit register verhuist
    also: dit bestand
  - when: code een keuze wijzigt die een grootboekrecord vastlegt
    also: dat record (bijwerken of vervangen), in dezelfde commit
