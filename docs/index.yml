  - path: docs/grootboek/adr/adr-013-nextjs-16-met-typescript-strict.md
    what: De keuze voor Next.js 16 (App Router) met TypeScript strict en React 19; overgezet uit plan.md.
    read_when: je het framework, de TypeScript-strictheid of de reden voor de serverroutes onder src/app/api wilt weten.
  - path: docs/grootboek/adr/adr-014-hosting-vercel.md
    what: De keuze om de app op Vercel te hosten, met de reden; overgezet uit plan.md.
    read_when: je wilt weten waarom Vercel is gekozen en waarom de app geen langlevend serverproces of WebSocket-server nodig heeft.
  - path: docs/grootboek/adr/adr-015-styling-css-modules.md
    what: De keuze om te stylen met CSS Modules over het overgenomen design system, niet met Tailwind; overgezet uit plan.md.
    read_when: je twijfelt of je Tailwind of een andere styling-aanpak moet gebruiken.
  - path: docs/grootboek/adr/adr-016-vlaggen-flag-icons.md
    what: De vlaggen komen uit flag-icons, met alleen de zes benodigde SVG's geïmporteerd; overgezet uit plan.md.
    read_when: je vlaggen of talen in de UI toevoegt of de import van flag-icons aanraakt.
  - path: docs/grootboek/hdr/hdr-017-geen-testsuite-behalve-scripts.md
    what: De app heeft geen testsuite, maar scripts die documenten herschrijven krijgen wel een node:test-test; overgezet uit plan.md.
    read_when: je overweegt tests toe te voegen of een script schrijft dat documenten herschrijft.
  - path: docs/grootboek/hdr/hdr-018-contextlagen-en-drift-check.md
    what: Waarom de context van het project gelaagd is (rules, CLAUDE.md per map, register, agents) en hoe npm run docs:check drift in de documentatie afdwingt; overgezet uit plan.md.
    read_when: je de lagen van de context wijzigt, een nieuw document registreert of de docs:check aanpast.
  - path: docs/grootboek/hdr/hdr-019-stage-verifieren-op-iphone.md
    what: Elke bouwstap wordt op iPhone Safari geverifieerd, met voor live STT een uiting van meer dan 20 seconden; overgezet uit plan.md.
